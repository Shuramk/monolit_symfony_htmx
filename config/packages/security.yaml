security:
    password_hashers:
        App\Domain\Identity\Entities\User:
            algorithm: argon2id

    providers:
        identity_users:
            id: App\Domain\Identity\Security\IdentityUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: identity_users
            user_checker: App\Domain\Identity\Security\IdentityUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: login
                password_parameter: password
                success_handler: App\Domain\Identity\Security\SingleSessionLoginSuccessHandler
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                csrf_parameter: _token
                csrf_token_id: session

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/migration, roles: PUBLIC_ACCESS }
        - { path: ^/enterprise, roles: ROLE_USER }
        - { path: '^/orders(?:/|$)', roles: ROLE_USER }
        - { path: '^/(settings/products|warehouse/products|products)(?:/|$)', roles: ROLE_USER }
        - { path: '^/settings/users(?:/|$)', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Domain\Identity\Entities\User:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
